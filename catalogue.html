
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catalogue | Smart Library</title>
    <link rel="stylesheet" href="style.css">
    <script src="catalogue.js" defer></script>
    <script src="main.js" defer></script>
    <script src="chatbot.js" defer></script>
</head>
<body class="catalogue-page">

<header class="navbar inner-navbar">
    <a href="home.html" class="logo">📚 Smart Library</a>
    <nav>
        <a href="home.html">Home</a>
        <a href="catalogue.html">Catalogue</a>
        <a href="login.html" id="authLink">Login</a>
        <a href="register.html" class="nav-btn" id="registerLink">Get Started</a>
    </nav>
</header>

<main class="catalogue-main">
    <section class="catalogue-heading">
        <p class="subtitle">YOUR NEXT FAVORITE BOOK</p>
        <h1>Explore Our <span>Library</span></h1>
        <p>Discover books, learn new skills, and explore new ideas.</p>
    </section>

    <section class="catalogue-tools">
        <input type="search" id="searchInput"
               placeholder="🔍 Search by title or author...">

        <select id="categoryFilter">
            <option value="all">All Categories</option>
            <option value="Programming">Programming</option>
            <option value="AI">Artificial Intelligence</option>
            <option value="Design">Design</option>
            <option value="Business">Business</option>
        </select>
    </section>

    <p id="resultsCount" class="results-count"></p>

    <section id="booksGrid" class="books-grid"></section>
</main>

<footer class="site-footer">
    <p>© 2026 Smart Library. Learn something new every day.</p>
</footer>

</body>
</html>
