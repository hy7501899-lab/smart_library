
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Smart Library</title>
    <link rel="stylesheet" href="style.css">
    <script src="auth.js" defer></script>
    <script src="chatbot.js" defer></script>
</head>
<body class="auth-page">

<header class="navbar inner-navbar">
    <a href="home.html" class="logo">📚 Smart Library</a>
    <nav>
        <a href="home.html">Home</a>
        <a href="catalogue.html">Catalogue</a>
        <a href="register.html" class="nav-btn">Create Account</a>
    </nav>
</header>

<main class="auth-layout">
    <section class="auth-card">
        <div class="auth-icon">🔑</div>
        <p class="subtitle">WELCOME BACK</p>
        <h1>Login to Your Account</h1>
        <p class="auth-description">
            Continue exploring your digital library.
        </p>

        <form id="loginForm">
            <label for="loginEmail">Email Address</label>
            <input id="loginEmail" type="email"
                   placeholder="you@example.com" required>

            <label for="loginPassword">Password</label>
            <input id="loginPassword" type="password"
                   placeholder="Enter your password" required>

            <button type="submit" class="auth-submit">
                Login
            </button>

            <p id="loginMessage" class="form-message"
               aria-live="polite"></p>
        </form>

        <p class="auth-switch">
            Don't have an account?
            <a href="register.html">Register</a>
        </p>
    </section>
</main>

</body>
</html>
